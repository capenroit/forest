name: tablet01
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  latlong2: ^0.9.1
  geolocator: ^9.0.2
  image_picker: ^1.0.0
  path_provider: ^2.1.6
  http: ^1.2.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.0.5
  flutter_map: ^8.2.2
  flutter_map_marker_cluster: ^8.2.2
  excel: ^4.0.2 
  file_saver: ^0.2.9
  permission_handler: ^11.3.0
  share_plus: ^13.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#1B8B5E"
  windows:
    generate: true
    image_path: "assets/logo.png"